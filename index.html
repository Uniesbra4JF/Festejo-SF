<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festejo - Gestão de Arrecadação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* bg-gray-900 */
        }
        /* Custom scrollbar for a more modern look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937; /* bg-gray-800 */
        }
        ::-webkit-scrollbar-thumb {
            background: #4d7c0f; /* Cor verde/dourado */
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #65a30d;
        }
        .gold-text {
            color: #ca8a04; /* text-yellow-600 */
        }
        .btn-primary {
            @apply bg-lime-700 hover:bg-lime-600 text-white font-semibold py-2 px-4 rounded-lg transition-all duration-300 shadow-md;
        }
        .btn-secondary {
             @apply bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg transition-all duration-300 shadow-md;
        }
        textarea::placeholder {
            white-space: pre-line;
        }
    </style>
</head>
<body class="text-gray-200">

    <div class="container mx-auto p-4 md:p-8 max-w-7xl">
        
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold gold-text tracking-wider">GESTÃO DO FESTEJO</h1>
            <p class="text-gray-400 mt-2">Arrecadação Salva Localmente</p>
        </header>

        <!-- Nights Grid -->
        <main id="nights-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-8">
            <!-- Cards will be injected by JavaScript -->
        </main>

        <!-- General Summary -->
        <section id="summary" class="bg-gray-800 p-6 rounded-2xl shadow-lg">
            <h2 class="text-2xl font-bold mb-4 border-b-2 border-lime-700 pb-2 gold-text">Resumo Geral</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 text-lg">
                <div id="total-oferta" class="bg-gray-900 p-4 rounded-lg"></div>
                <div id="total-leilao" class="bg-gray-900 p-4 rounded-lg"></div>
                <div id="total-barraca" class="bg-gray-900 p-4 rounded-lg"></div>
            </div>
            <div id="grand-total" class="bg-lime-800 text-white text-2xl font-bold p-4 rounded-lg text-center tracking-widest">
                <!-- Grand total will be injected here -->
            </div>
        </section>

        <!-- Actions -->
        <section class="mt-8 flex flex-col sm:flex-row flex-wrap justify-center items-center gap-4">
            <button id="report-btn" class="btn-primary w-full sm:w-auto">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block mr-2" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 4a3 3 0 00-3 3v6a3 3 0 003 3h10a3 3 0 003-3V7a3 3 0 00-3-3H5zm-1 9v-1h5v2H5a1 1 0 01-1-1zm7 1h4a1 1 0 001-1v-1h-5v2zm0-4h5V8h-5v2zM4 8h5v2H4V8z" clip-rule="evenodd" /></svg>
                Gerar Relatório
            </button>
            <button id="copy-report-btn" class="btn-secondary w-full sm:w-auto">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block mr-2" viewBox="0 0 20 20" fill="currentColor"><path d="M7 9a2 2 0 012-2h6a2 2 0 012 2v6a2 2 0 01-2 2H9a2 2 0 01-2-2V9z" /><path d="M4 3a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H4z" /></svg>
                Copiar Relatório
            </button>
            <button id="export-btn" class="btn-secondary w-full sm:w-auto">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block mr-2" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 9.707a1 1 0 011.414 0L9 11.086V3a1 1 0 112 0v8.086l1.293-1.379a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                Exportar JSON
            </button>
            <label for="import-file" class="btn-secondary w-full sm:w-auto cursor-pointer text-center">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block mr-2" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 9.707a1 1 0 011.414 0L9 11.086V3a1 1 0 112 0v8.086l1.293-1.379a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" transform="rotate(180 10 10)" /></svg>
                Importar JSON
            </label>
            <input type="file" id="import-file" class="hidden" accept=".json">
        </section>

    </div>

    <!-- Modal for Editing -->
    <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-70 flex justify-center items-center z-50 hidden transition-opacity duration-300">
        <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-11/12 max-w-md transform transition-transform duration-300 scale-95">
            <h2 id="modal-title" class="text-2xl font-bold mb-6 gold-text">Registrar Valores</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-night-id">
                <div class="mb-4">
                    <label for="descricao" class="block text-gray-400 mb-2">✏️ Descrição (Ex: Noiteiros, Atração)</label>
                    <textarea id="descricao" rows="3" class="w-full bg-gray-900 border-2 border-gray-700 rounded-lg p-3 focus:border-lime-600 focus:ring-lime-600 outline-none transition-colors" placeholder="Família Silva&#10;Atração: Zé Vaqueiro"></textarea>
                </div>
                <div class="mb-4">
                    <label for="oferta" class="block text-gray-400 mb-2">💰 Oferta</label>
                    <input type="number" id="oferta" step="0.01" class="w-full bg-gray-900 border-2 border-gray-700 rounded-lg p-3 focus:border-lime-600 focus:ring-lime-600 outline-none transition-colors" placeholder="R$ 0,00">
                </div>
                <div id="leilao-wrapper" class="mb-4">
                    <label for="leilao" class="block text-gray-400 mb-2">🎉 Leilão</label>
                    <input type="number" id="leilao" step="0.01" class="w-full bg-gray-900 border-2 border-gray-700 rounded-lg p-3 focus:border-lime-600 focus:ring-lime-600 outline-none transition-colors" placeholder="R$ 0,00">
                </div>
                <div id="barraca-wrapper" class="mb-6">
                    <label for="barraca" class="block text-gray-400 mb-2">🍴 Barraca</label>
                    <input type="number" id="barraca" step="0.01" class="w-full bg-gray-900 border-2 border-gray-700 rounded-lg p-3 focus:border-lime-600 focus:ring-lime-600 outline-none transition-colors" placeholder="R$ 0,00">
                </div>
                <div class="flex justify-end gap-4">
                    <button type="button" id="cancel-btn" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-lime-600 text-white py-2 px-5 rounded-lg shadow-lg opacity-0 translate-y-10 transition-all duration-500">
        <!-- Message here -->
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Element selectors
            const nightsGrid = document.getElementById('nights-grid');
            const totalOfertaEl = document.getElementById('total-oferta');
            const totalLeilaoEl = document.getElementById('total-leilao');
            const totalBarracaEl = document.getElementById('total-barraca');
            const grandTotalEl = document.getElementById('grand-total');
            const modal = document.getElementById('edit-modal');
            const modalTitle = document.getElementById('modal-title');
            const editForm = document.getElementById('edit-form');
            const cancelBtn = document.getElementById('cancel-btn');
            const editNightIdInput = document.getElementById('edit-night-id');
            const descricaoInput = document.getElementById('descricao');
            const ofertaInput = document.getElementById('oferta');
            const leilaoWrapper = document.getElementById('leilao-wrapper');
            const leilaoInput = document.getElementById('leilao');
            const barracaWrapper = document.getElementById('barraca-wrapper');
            const barracaInput = document.getElementById('barraca');
            const exportBtn = document.getElementById('export-btn');
            const importFile = document.getElementById('import-file');
            const reportBtn = document.getElementById('report-btn');
            const copyReportBtn = document.getElementById('copy-report-btn');
            const toast = document.getElementById('toast');

            let nightsData = [];

            // --- Utility Functions ---

            const formatCurrency = (value) => {
                return new Intl.NumberFormat('pt-BR', {
                    style: 'currency',
                    currency: 'BRL'
                }).format(value);
            };
            
            const showToast = (message, isError = false) => {
                toast.textContent = message;
                toast.classList.remove('opacity-0', 'translate-y-10');
                toast.classList.toggle('bg-red-600', isError);
                toast.classList.toggle('bg-lime-600', !isError);

                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-10');
                }, 3000);
            };

            const copyToClipboard = (text) => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('Relatório copiado com sucesso!');
                } catch (err) {
                    showToast('Falha ao copiar o relatório.', true);
                }
                document.body.removeChild(textarea);
            };

            // --- Data Persistence ---

            const saveData = () => {
                localStorage.setItem('festejoData', JSON.stringify(nightsData));
            };

            const loadData = () => {
                const savedData = localStorage.getItem('festejoData');
                if (savedData) {
                    try {
                        let parsedData = JSON.parse(savedData);
                        if (Array.isArray(parsedData) && parsedData.length >= 9) {
                            nightsData = upgradeData(parsedData);
                        } else {
                            throw new Error("Formato de dados inválido");
                        }
                    } catch (error) {
                        console.error("Falha ao carregar dados, inicializando do zero.", error);
                        initializeData();
                    }
                } else {
                    initializeData();
                }
            };
            
            const initializeData = () => {
                nightsData = Array.from({ length: 9 }, (_, i) => ({
                    id: i + 1,
                    title: `NOITE ${i + 1}`,
                    descricao: '',
                    oferta: 0,
                    leilao: 0,
                    barraca: 0,
                    hasLeilao: true,
                    hasBarraca: true,
                }));
                nightsData.push({
                    id: 10,
                    title: 'MISSA',
                    descricao: '',
                    oferta: 0,
                    leilao: 0,
                    barraca: 0,
                    hasLeilao: false,
                    hasBarraca: false,
                });
            };

            const upgradeData = (data) => {
                data.forEach((night) => {
                    if (!night.title) night.title = night.id === 10 ? 'MISSA DO VAQUEIRO' : `NOITE ${night.id}`;
                    if (night.hasLeilao === undefined) night.hasLeilao = true;
                    if (night.hasBarraca === undefined) night.hasBarraca = true;
                });
                
                let missa = data.find(night => night.id === 10);
                if (missa) {
                    missa.title = 'MISSA';
                    missa.hasLeilao = false;
                    missa.hasBarraca = false;
                } else {
                     data.push({
                        id: 10, title: 'MISSA', descricao: '', oferta: 0, leilao: 0, barraca: 0, hasLeilao: false, hasBarraca: false
                    });
                }
                return data;
            }

            // --- UI Rendering ---

            const render = () => {
                nightsGrid.innerHTML = '';
                let totalOferta = 0, totalLeilao = 0, totalBarraca = 0;

                nightsData.forEach(night => {
                    const nightTotal = night.oferta + (night.hasLeilao ? night.leilao : 0) + (night.hasBarraca ? night.barraca : 0);
                    totalOferta += night.oferta;
                    totalLeilao += night.leilao;
                    totalBarraca += night.barraca;

                    let descriptionBlock = '';
                    const hasDescription = night.descricao && night.descricao.trim() !== '';

                    if (hasDescription) {
                        const lines = night.descricao.trim().split('\n');
                        const firstLine = lines[0];
                        const hasMoreLines = lines.length > 1;
                        descriptionBlock = `
                            <p class="text-sm text-gray-400 whitespace-pre-wrap">${firstLine}</p>
                            ${hasMoreLines ? `<button data-expand-id="${night.id}" class="expand-btn text-lime-400 text-xs hover:underline mt-1">Ver mais</button>` : ''}
                        `;
                    }

                    const card = document.createElement('div');
                    card.className = 'bg-gray-800 p-5 rounded-2xl shadow-lg flex flex-col justify-between';
                    card.innerHTML = `
                        <div>
                            <h3 class="text-xl font-bold gold-text mb-2">${night.title}</h3>
                            <div class="description-container mb-4 min-h-[44px]">
                                ${descriptionBlock}
                            </div>
                            <div class="space-y-2 text-gray-300">
                                <p>💰 Oferta: <span class="font-semibold float-right">${formatCurrency(night.oferta)}</span></p>
                                ${night.hasLeilao ? `<p>🎉 Leilão: <span class="font-semibold float-right">${formatCurrency(night.leilao)}</span></p>` : ''}
                                ${night.hasBarraca ? `<p>🍴 Barraca: <span class="font-semibold float-right">${formatCurrency(night.barraca)}</span></p>` : ''}
                            </div>
                        </div>
                        <div class="mt-4 pt-4 border-t-2 border-gray-700">
                           <p class="text-lg font-bold">Total do Evento: <span class="float-right gold-text">${formatCurrency(nightTotal)}</span></p>
                           <button data-id="${night.id}" class="register-btn w-full mt-4 btn-secondary">Detalhes / Registrar</button>
                        </div>
                    `;
                    nightsGrid.appendChild(card);
                });

                // Update Summary
                totalOfertaEl.innerHTML = `<span class="text-gray-400">Total Oferta:</span> <strong class="float-right text-lg">${formatCurrency(totalOferta)}</strong>`;
                totalLeilaoEl.innerHTML = `<span class="text-gray-400">Total Leilão:</span> <strong class="float-right text-lg">${formatCurrency(totalLeilao)}</strong>`;
                totalBarracaEl.innerHTML = `<span class="text-gray-400">Total Barraca:</span> <strong class="float-right text-lg">${formatCurrency(totalBarraca)}</strong>`;
                grandTotalEl.innerHTML = `TOTAL GERAL: ${formatCurrency(totalOferta + totalLeilao + totalBarraca)}`;
            };

            // --- Report Generation ---
            
            const generatePlainTextReport = () => {
                let report = '📊 *RELATÓRIO DO FESTEJO*\n\n';
                let totalOferta = 0, totalLeilao = 0, totalBarraca = 0;

                nightsData.forEach(n => {
                    totalOferta += n.oferta;
                    totalLeilao += n.leilao;
                    totalBarraca += n.barraca;
                });
                const grandTotal = totalOferta + totalLeilao + totalBarraca;

                report += '*Resumo Geral:*\n';
                report += `💰 Ofertas: ${formatCurrency(totalOferta)}\n`;
                report += `🎉 Leilões: ${formatCurrency(totalLeilao)}\n`;
                report += `🍴 Barracas: ${formatCurrency(totalBarraca)}\n`;
                report += `*Total Geral: ${formatCurrency(grandTotal)}*\n\n------------------------\n\n*Detalhes por Evento:*\n\n`;

                nightsData.forEach(n => {
                    const nightTotal = n.oferta + (n.hasLeilao ? n.leilao : 0) + (n.hasBarraca ? n.barraca : 0);
                    report += `*${n.title}* - Total: ${formatCurrency(nightTotal)}\n`;
                    if (n.descricao && n.descricao.trim()) report += `_${n.descricao.replace(/\n/g, ', ')}_\n`;
                    report += ` • Oferta: ${formatCurrency(n.oferta)}\n`;
                    if (n.hasLeilao) report += ` • Leilão: ${formatCurrency(n.leilao)}\n`;
                    if (n.hasBarraca) report += ` • Barraca: ${formatCurrency(n.barraca)}\n`;
                    report += '\n';
                });
                return report;
            };

            const generateHtmlReport = () => {
                 let totalOferta = 0, totalLeilao = 0, totalBarraca = 0;
                nightsData.forEach(n => {
                    totalOferta += n.oferta;
                    totalLeilao += n.leilao;
                    totalBarraca += n.barraca;
                });
                const grandTotal = totalOferta + totalLeilao + totalBarraca;

                let reportHtml = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório do Festejo</title><style>body{font-family:sans-serif;margin:2rem;color:#333}h1,h2,h3{color:#111}h1{text-align:center}.summary,.night-details{border:1px solid #ccc;padding:1rem;margin-bottom:1rem;border-radius:8px}.summary h3{font-size:1.5rem;text-align:center;background:#eee;padding:.5rem;border-radius:4px}.night{border-bottom:1px solid #eee;padding-bottom:1rem;margin-bottom:1rem}.night:last-child{border-bottom:none}.night h3{margin-top:0}.night-total{font-weight:bold}.description{white-space:pre-wrap;color:#555;font-style:italic;background-color:#f9f9f9;padding:.5rem;border-radius:4px;margin-bottom:1rem}@media print{body{margin:1rem}.no-print{display:none}}button{font-size:1rem;padding:.5rem 1rem;border-radius:8px;border:1px solid #ccc;cursor:pointer;background:#f0f0f0;margin-top:1rem}button:hover{background:#e0e0e0}</style></head><body><h1>Relatório do Festejo</h1><div class="summary"><h2>Resumo Geral</h2><p>Total Oferta:<strong>${formatCurrency(totalOferta)}</strong></p><p>Total Leilão:<strong>${formatCurrency(totalLeilao)}</strong></p><p>Total Barraca:<strong>${formatCurrency(totalBarraca)}</strong></p><h3>Total Geral:${formatCurrency(grandTotal)}</h3></div><div class="night-details"><h2>Detalhes por Evento</h2>`;
                
                nightsData.forEach(n => {
                    const nightTotal = n.oferta + (n.hasLeilao ? n.leilao : 0) + (n.hasBarraca ? n.barraca : 0);
                    reportHtml += `<div class="night"><h3>${n.title}</h3>${(n.descricao && n.descricao.trim())?`<p class="description">${n.descricao}</p>`:''}<p>Oferta:${formatCurrency(n.oferta)}</p>${n.hasLeilao?`<p>Leilão:${formatCurrency(n.leilao)}</p>`:''}${n.hasBarraca?`<p>Barraca:${formatCurrency(n.barraca)}</p>`:''}<p class="night-total">Total do Evento:${formatCurrency(nightTotal)}</p></div>`;
                });

                reportHtml += `</div><button class="no-print" onclick="window.print()">Imprimir / Salvar PDF</button></body></html>`;
                return reportHtml;
            };

            // --- Modal Logic ---
            
            const openModal = (nightId) => {
                const night = nightsData.find(n => n.id == nightId);
                if (!night) return;

                modalTitle.textContent = `Registrar Valores - ${night.title.toUpperCase()}`;
                editNightIdInput.value = night.id;
                descricaoInput.value = night.descricao || '';
                ofertaInput.value = night.oferta || '';
                
                leilaoWrapper.style.display = night.hasLeilao ? 'block' : 'none';
                barracaWrapper.style.display = night.hasBarraca ? 'block' : 'none';
                leilaoInput.value = night.hasLeilao ? night.leilao || '' : 0;
                barracaInput.value = night.hasBarraca ? night.barraca || '' : 0;
                
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.add('opacity-100');
                    modal.querySelector('div').classList.remove('scale-95');
                }, 10);
            };

            const closeModal = () => {
                modal.classList.remove('opacity-100');
                modal.querySelector('div').classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 300);
            };

            // --- Event Listeners ---
            
            nightsGrid.addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (!btn) return;

                if (btn.classList.contains('register-btn')) {
                    openModal(parseInt(btn.dataset.id, 10));
                } else if (btn.classList.contains('expand-btn')) {
                    const night = nightsData.find(n => n.id == btn.dataset.expandId);
                    if (!night) return;
                    const p = btn.previousElementSibling;
                    if (btn.textContent === 'Ver mais') {
                        p.textContent = night.descricao.trim();
                        btn.textContent = 'Ver menos';
                    } else {
                        const firstLine = night.descricao.trim().split('\n')[0];
                        p.textContent = firstLine;
                        btn.textContent = 'Ver mais';
                    }
                }
            });

            cancelBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

            editForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const id = parseInt(editNightIdInput.value, 10);
                const night = nightsData.find(n => n.id === id);
                if (night) {
                    night.descricao = descricaoInput.value;
                    night.oferta = parseFloat(ofertaInput.value) || 0;
                    night.leilao = parseFloat(leilaoInput.value) || 0;
                    night.barraca = parseFloat(barracaInput.value) || 0;
                    saveData();
                    render();
                    closeModal();
                    showToast(`Valores de "${night.title}" salvos!`);
                }
            });
            
            exportBtn.addEventListener('click', () => {
                const dataStr = JSON.stringify(nightsData, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'festejo_dados.json';
                a.click();
                URL.revokeObjectURL(url);
                showToast("Dados exportados!");
            });
            
            importFile.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        let importedData = JSON.parse(event.target.result);
                        if (Array.isArray(importedData) && importedData.length >= 9 && 'id' in importedData[0]) {
                            nightsData = upgradeData(importedData);
                            saveData();
                            render();
                            showToast("Dados importados com sucesso!");
                        } else {
                            throw new Error("Formato do arquivo JSON inválido.");
                        }
                    } catch (err) {
                        showToast(err.message, true);
                    } finally {
                        importFile.value = '';
                    }
                };
                reader.readAsText(file);
            });

            reportBtn.addEventListener('click', () => {
                const reportHtml = generateHtmlReport();
                const reportWindow = window.open('', '_blank');
                reportWindow.document.write(reportHtml);
                reportWindow.document.close();
            });

            copyReportBtn.addEventListener('click', () => {
                const reportText = generatePlainTextReport();
                copyToClipboard(reportText);
            });

            // --- Initial Load ---
            loadData();
            render();
        });
    </script>
</body>
</html>
